{% load socialaccount %}
<!DOCTYPE html>
<html>
<head>
    <title>Sign In - EuroPython Internal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        .login-box {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 { margin-bottom: 0.5rem; }
        p { color: #666; margin-bottom: 1.5rem; }
        .btn-google {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: #4285f4;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 1rem;
        }
        .btn-google:hover { background: #357ae8; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>EuroPython Internal</h1>
        <p>Sign in with your @europython.eu account</p>
        <a class="btn-google" href="{% provider_login_url 'google' %}">Sign in with Google</a>
    </div>
</body>
</html>
