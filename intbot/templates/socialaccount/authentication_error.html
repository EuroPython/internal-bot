<!DOCTYPE html>
<html>
<head>
    <title>Authentication Error - EuroPython Internal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        .box {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
        }
        h1 { color: #d32f2f; }
        a { color: #4285f4; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Authentication Error</h1>
        <p>Sign-in is restricted to @europython.eu accounts only.</p>
        <p>If you believe this is an error, please contact an admin.</p>
        <p><a href="/accounts/login/">Try again</a></p>
    </div>
</body>
</html>
